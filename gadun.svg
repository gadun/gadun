  <ellipse cx="302" cy="254" rx="15" ry="9" fill="#FB7185" opacity="0.55" />

  <!-- Mata Bahagia (Melengkung Tersenyum) -->
  <path d="M 196 224 Q 208 210 220 224" fill="none" stroke="#0F172A" stroke-width="6" stroke-linecap="round" />
  <path d="M 272 224 Q 284 210 296 224" fill="none" stroke="#0F172A" stroke-width="6" stroke-linecap="round" />

  <!-- Belalai Mengangkat Koin -->
