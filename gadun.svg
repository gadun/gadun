  <ellipse cx="136" cy="242" rx="64" ry="80" fill="#5EEAD4" stroke="#0F766E" stroke-width="6" />
  <ellipse cx="142" cy="246" rx="40" ry="52" fill="#FDA4AF" opacity="0.75" />

  <ellipse cx="356" cy="242" rx="64" ry="80" fill="#5EEAD4" stroke="#0F766E" stroke-width="6" />
  <ellipse cx="350" cy="246" rx="40" ry="52" fill="#FDA4AF" opacity="0.75" />

  <!-- Badan Duduk -->
  <ellipse cx="246" cy="342" rx="84" ry="68" fill="#99F6E4" stroke="#0F766E" stroke-width="6" />
  <ellipse cx="246" cy="352" rx="50" ry="42" fill="#CCFBF1" />

  <!-- Kaki Depan -->
  <ellipse cx="188" cy="388" rx="28" ry="22" fill="#5EEAD4" stroke="#0F766E" stroke-width="6" />
  <ellipse cx="304" cy="388" rx="28" ry="22" fill="#5EEAD4" stroke="#0F766E" stroke-width="6" />

  <!-- Kepala -->
  <circle cx="246" cy="236" r="88" fill="#99F6E4" stroke="#0F766E" stroke-width="6" />

