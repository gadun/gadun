<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Gajah Imut dengan Koin Emas SVG">
  <defs>
    <radialGradient id="mintBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </radialGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#mintBg)" />
  <ellipse cx="256" cy="412" rx="125" ry="18" fill="#6EE7B7" opacity="0.45" />

  <!-- Koin Emas Melayang di Atas Belalai -->
  <g transform="translate(334, 152)">
    <circle cx="0" cy="0" r="34" fill="url(#coinGrad)" stroke="#B45309" stroke-width="5" />
    <circle cx="0" cy="0" r="24" fill="none" stroke="#FEF9C3" stroke-width="2.5" stroke-dasharray="6 4" />
    <text x="0" y="10" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="900" fill="#92400E">G</text>
  </g>

  <!-- Bintang Kilau Kecil -->
  <g fill="#FACC15">
    <polygon points="390,118 394,128 404,132 394,136 390,146 386,136 376,132 386,128" />
    <polygon points="282,112 285,119 292,122 285,125 282,132 279,125 272,122 279,119" />
  </g>

